<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0b0e0f" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<!--
			Applies a saved theme choice before first paint - without this, a user
			who picked "light" gets one dark-then-light flash on every load,
			since the CSS itself can only react to system preference by default.
		-->
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					if (saved === 'light' || saved === 'dark') {
						document.documentElement.setAttribute('data-theme', saved);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
