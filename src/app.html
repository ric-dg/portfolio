<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<!--
			Applies a saved theme choice before first paint - without this, a user
			who picked "light" gets one dark-then-light flash on every load,
			since the CSS itself can only react to system preference by default.
			Also syncs the theme-color meta tag (browser chrome color) to match -
			ThemeToggle.svelte keeps it in sync on every later toggle; these two
			hex values must match --bg's light/dark values in app.css.
		-->
		<script>
			(function () {
				var saved = null;
				try {
					saved = localStorage.getItem('theme');
				} catch (e) {}
				var isDark =
					saved === 'dark' ||
					(saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (saved === 'light' || saved === 'dark') {
					document.documentElement.setAttribute('data-theme', saved);
				}
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', isDark ? '#14141a' : '#ffffff');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
